<script>
"use strict";
const SALT="503263fc54f73c41eef1adb50b2fb2f8",IT=600000,KS="xbm_key_v1";
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>btoa(String.fromCharCode(...u));
async function open_(raw){const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
const d=b64(document.getElementById("payload").textContent);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12),additionalData:new TextEncoder().encode("xbm1")},key,d.slice(12));
const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
document.open();document.write(txt);document.close();}
async function derive(pw){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:hex(SALT),iterations:IT,hash:"SHA-256"},b,256));}
function ask(m){document.getElementById("wait").style.display="none";document.getElementById("f").style.display="flex";document.getElementById("msg").textContent=m||"";}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;if(!pw)return;
document.getElementById("msg").textContent="Unlocking…";let raw;
try{raw=await derive(pw);}catch(x){return ask("This browser can't unlock the page.");}
try{await open_(raw);try{localStorage.setItem(KS,tob64(raw));}catch(x){}}catch(x){ask("Wrong password.");}};
(async()=>{if(!window.crypto||!crypto.subtle||typeof DecompressionStream==="undefined")return ask("Please update iOS/Safari to open this page.");
let s=null;try{s=localStorage.getItem(KS);}catch(x){}
if(s){try{await open_(b64(s));return;}catch(x){try{localStorage.removeItem(KS);}catch(y){}}}ask();})();
</script></body></html>
